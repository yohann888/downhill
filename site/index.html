<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downhill | Built with Devin</title>
<meta name="description" content="A downhill mountain bike game built with Devin.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 500 15px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8eefc;
    background: linear-gradient(180deg, #060a1c 0%, #141f52 22%, #3b4fa0 40%, #b0709e 54%, #f08f5c 66%, #f8c47c 76%);
    overflow: hidden;
  }
  .sky { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .sun {
    position: absolute; left: 50%; bottom: 40vh; width: 46vmin; height: 46vmin; margin-left: -23vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 214, 150, .9) 0%, rgba(255, 170, 100, .35) 40%, rgba(255, 150, 90, 0) 70%);
    animation: pulse 9s ease-in-out infinite;
  }
  .stars, .stars::after {
    position: absolute; inset: -50% 0 0 0; height: 150%;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 8%, #cfe0ff 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 58% 22%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 74% 12%, #fff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 90% 30%, #cfe0ff 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 36%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 46% 40%, #fff 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 82% 44%, #fff 50%, transparent 51%);
    background-size: 420px 300px;
    opacity: .7;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  .stars::after { content: ""; inset: 0; height: 100%; background-size: 260px 220px; animation-delay: -3s; opacity: .5; }
  .ridge {
    position: absolute; left: 0; bottom: 0; width: 200%;
    background-repeat: repeat-x; background-size: 50% 100%;
    will-change: transform;
    animation: ride linear infinite;
  }
  .r1 { height: 58vh; background-image: url(ridge-1.svg); animation-duration: 160s; opacity: .85; }
  .r2 { height: 46vh; background-image: url(ridge-2.svg); animation-duration: 95s; }
  .r3 { height: 34vh; background-image: url(ridge-3.svg); animation-duration: 55s; }
  .r4 { height: 22vh; background-image: url(ridge-4.svg); animation-duration: 30s; }
  .haze {
    position: absolute; left: 0; right: 0; bottom: 28vh; height: 24vh;
    background: linear-gradient(180deg, rgba(240, 163, 94, 0), rgba(240, 163, 94, .18), rgba(240, 163, 94, 0));
  }
  .snow {
    position: absolute; inset: -100% 0 0 0; height: 200%;
    background-image:
      radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.8) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 40% 60%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 70% 30%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 80%, rgba(255,255,255,.5) 50%, transparent 51%);
    background-size: 300px 300px;
    will-change: transform;
    animation: fall 18s linear infinite;
  }
  @keyframes ride { to { transform: translateX(-50%); } }
  @keyframes fall { to { transform: translate(-300px, 50%); } }
  @keyframes twinkle { to { opacity: .35; } }
  @keyframes pulse { 50% { transform: scale(1.06); opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .sky *, .sky *::after { animation: none !important; } }

  main {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  .bar {
    width: min(1180px, 86vw, calc((100vh - 200px) * 16 / 9));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .frame {
    width: min(1180px, 86vw, calc((100vh - 200px) * 16 / 9));
    aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden;
    background: #000;
    border: 1px solid rgba(255, 255, 255, .18);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 6px rgba(255, 255, 255, .04);
  }
  .frame iframe { display: block; width: 100%; height: 100%; border: 0; }
  button {
    font: inherit; font-size: 13px; color: inherit; cursor: pointer;
    padding: 7px 12px; border-radius: 8px;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .2);
  }
  button:hover { background: rgba(255, 255, 255, .16); }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 18px 8px 8px; border-radius: 999px;
    color: #fff; text-decoration: none;
    background: rgba(7, 11, 29, .7); border: 1px solid rgba(255, 255, 255, .2);
    backdrop-filter: blur(8px);
    transition: transform .2s, border-color .2s;
  }
  .badge:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, .5); }
  .badge img.otter { width: 48px; height: 48px; object-fit: contain; animation: bob 3s ease-in-out infinite; }
  .badge span { font-size: 15px; opacity: .85; }
  .badge img.logo { height: 22px; }
  @keyframes bob { 50% { transform: translateY(-3px) rotate(-4deg); } }
  @media (max-width: 700px) {
    main { justify-content: flex-start; padding: 10px; gap: 10px; }
    .bar, .frame { width: 100%; }
    .frame { aspect-ratio: auto; flex: 1; }
    h1 { font-size: 16px; }
    #fs { display: none; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="stars"></div>
  <div class="sun"></div>
  <div class="ridge r1"></div>
  <div class="haze"></div>
  <div class="ridge r2"></div>
  <div class="ridge r3"></div>
  <div class="ridge r4"></div>
  <div class="snow"></div>
</div>
<main>
  <div class="bar">
    <h1>Downhill</h1>
    <button id="fs" type="button">Fullscreen</button>
  </div>
  <div class="frame">
    <iframe id="game" src="play/" title="Downhill game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  </div>
  <a class="badge" href="https://devin.ai" target="_blank" rel="noopener">
    <img class="otter" src="otter.png" alt="">
    <span>Built with</span>
    <img class="logo" src="devin-logo.svg" alt="Devin">
  </a>
</main>
<script>
  const game = document.getElementById('game');
  game.addEventListener('load', () => game.focus());
  document.getElementById('fs').addEventListener('click', () => {
    game.requestFullscreen?.().then(() => game.focus()).catch(() => {});
  });
</script>
</body>
</html>
